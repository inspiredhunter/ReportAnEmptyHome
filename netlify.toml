# ReportAnEmptyHome.co.uk — ACT-738
# The repository root is the deployable site, mirroring the governed Drive
# folder "ACT-738 — FINAL ACT-768 HTML" exactly. No build step: the site is
# static HTML with inline CSS/JS and local assets.

[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# Serverless bridges hold every API key server-side (ACT-738 SEC-1).
# Pages post to same-origin relative paths, so nothing is injected into the
# HTML and no credential is ever present in page source.
#
#   /api/options   ACT-785  Empty Homes guide request -> Brevo (not yet built)
#
# Environment variables are set in Netlify, never committed:
#   BrevoAPIKey, SUPABASE_URL, SUPABASE_ANON_KEY
