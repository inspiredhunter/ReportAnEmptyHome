<style>
:root{
  --aubergine:#321B46;
  --amber:#F2A900;
  --white:#FFFFFF;
  --ivory:#FAF7F2;
  --ink:#321B46;
  --muted:#675D70;
  --line:#D9D0DE;
  --track:#E7E0EA;
  --danger:#9F1D2D;
  --success:#2D6A4F;
  --shadow:0 16px 40px rgba(50,27,70,.12);
  --radius:16px;
  --max:1120px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;background:var(--ivory);color:var(--ink)}
body{margin:0;min-width:320px;line-height:1.55;background:var(--ivory)}
img{max-width:100%;height:auto}
button,input,select,textarea{font:inherit}
a{color:var(--aubergine)}
.skip-link{position:fixed;left:16px;top:8px;z-index:9999;background:var(--amber);color:var(--aubergine);padding:12px 16px;min-height:44px;display:inline-flex;align-items:center;border-radius:6px;transform:translateY(-160%);font-weight:800}
.skip-link:focus{transform:none}
:focus-visible{outline:3px solid var(--white);outline-offset:2px;box-shadow:0 0 0 6px var(--amber),0 0 0 8px var(--aubergine)}
.site-header{height:82px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,5vw,72px);gap:18px}
.brand{display:inline-flex;align-items:center}
.brand img{display:block;height:56px;width:auto}
.header-action{min-height:44px;padding:9px 14px;border:0;border-radius:6px;background:var(--amber);color:var(--aubergine);font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.wrap{width:min(var(--max),calc(100% - 32px));margin:0 auto}
main{min-height:calc(100vh - 82px)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(24px,5vw,56px)}
h1,h2,h3{line-height:1.08;margin-top:0}
h1{font-size:clamp(2.35rem,6vw,4.5rem)}
h2{font-size:clamp(2rem,4vw,3rem)}
h3{font-size:clamp(1.35rem,2.4vw,1.8rem)}
.lead{font-size:clamp(1.1rem,2vw,1.35rem)}
.meta{color:var(--muted);font-size:.95rem}
.eyebrow{font-size:.88rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--aubergine)}
.hero-copy .eyebrow{color:var(--amber)}
.btn{min-height:48px;padding:12px 22px;border-radius:7px;border:2px solid transparent;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn-primary{background:var(--amber);color:var(--aubergine);border-color:var(--amber)}
.btn-secondary{background:var(--aubergine);color:var(--white);border-color:var(--aubergine)}
.btn-quiet{background:var(--white);color:var(--aubergine);border-color:var(--aubergine)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.field{margin:0 0 20px}
label,legend{font-weight:750}
label{display:block;margin-bottom:7px}
input,select,textarea{width:100%;min-height:48px;border:2px solid var(--aubergine);border-radius:7px;background:var(--white);color:var(--ink);padding:10px 12px}
textarea{min-height:120px;resize:vertical}
[aria-invalid="true"]{border-color:var(--danger)}
fieldset{border:0;padding:0;margin:0 0 20px}
.choice-list{display:grid;gap:10px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:9px;background:var(--white);min-height:48px}
.choice input{width:22px;min-height:22px;margin:2px 0 0}
.required{font-weight:800}
.required::after{content:" *";color:var(--danger)}
.help{color:var(--muted);font-size:.95rem}
.notice{border-left:5px solid var(--aubergine);background:var(--ivory);padding:16px 18px;margin:18px 0}
.error{color:var(--danger);font-weight:750}
.field-error{color:var(--danger);font-weight:750;margin:6px 0 0}
.field-error:empty{display:none}
.status[hidden]{display:none}
.progress{margin-bottom:24px}
.progress-meta{display:flex;justify-content:space-between;gap:16px;font-weight:800}
.progress-track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:8px}
.progress-bar{height:100%;background:var(--aubergine);width:16.666%}
.step[hidden]{display:none!important}
.step-shell{padding:42px 0 72px}
.step-head{max-width:760px;margin-bottom:30px}
.route-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.route-card{border-radius:18px;padding:34px;min-height:310px;display:flex;flex-direction:column}
.route-card.owner{background:var(--amber);color:var(--aubergine)}
.route-card.reporter{background:var(--aubergine);color:var(--white)}
.route-card .route-icon{width:56px;height:56px;border:3px solid currentColor;border-radius:12px;display:grid;place-items:center;margin-bottom:28px}
.route-card .route-icon svg{display:block;width:30px;height:30px}
.route-card .btn{margin-top:auto;align-self:flex-start}
.route-card.owner .btn{background:var(--aubergine);color:var(--white);border-color:var(--aubergine)}
.route-card.reporter .btn{background:var(--amber);color:var(--aubergine);border-color:var(--amber)}
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.option-card{border:2px solid var(--line);border-radius:12px;padding:20px;background:var(--white)}
.option-card button{width:100%}
.address-result{display:block;width:100%;text-align:left;background:var(--white);border:2px solid var(--line);padding:14px;border-radius:8px;margin:8px 0;min-height:48px}
.address-result:hover{border-color:var(--aubergine)}
.selected-box{border:3px solid var(--aubergine);border-radius:10px;padding:18px;background:var(--ivory)}
.hero{display:grid;grid-template-columns:minmax(0,45%) minmax(0,55%);min-height:calc(100vh - 82px);background:var(--aubergine)}
.hero-copy{color:var(--white);padding:clamp(54px,8vw,110px) clamp(28px,7vw,90px);display:flex;flex-direction:column;justify-content:center}
.hero-copy h1 .accent{display:block;color:var(--amber)}
.hero-scene{position:relative;min-height:560px;overflow:hidden}
.hero-photo{position:absolute;inset:0;background-image:url("assets/uk-terraced-empty-home-hero.jpg");background-image:image-set(url("assets/uk-terraced-empty-home-hero.webp") type("image/webp"),url("assets/uk-terraced-empty-home-hero.jpg") type("image/jpeg"));background-position:center;background-size:cover;background-repeat:no-repeat}
.quote{position:absolute;left:8%;right:8%;bottom:7%;background:var(--white);color:var(--aubergine);border-left:7px solid var(--amber);padding:18px 22px;box-shadow:var(--shadow);max-width:430px}
.trust{margin-top:24px}
.trust strong{color:var(--amber)}
.legal{padding:54px 0 80px}
.legal article,.legal .card{background:var(--white);padding:clamp(24px,5vw,52px);border-radius:var(--radius);box-shadow:var(--shadow)}
.legal h2{margin-top:34px;font-size:1.55rem}
.simple-page{padding:58px 0 80px}
.simple-page .panel{max-width:840px;margin:0 auto}
footer{background:var(--aubergine);color:var(--white);padding:26px 0}
footer a{color:var(--white)}
.footer-links{display:flex;flex-wrap:wrap;gap:18px}
.honeypot{position:absolute!important;left:-10000px!important;width:1px!important;height:1px!important;overflow:hidden!important}
@media(max-width:800px){
  .site-header{height:74px;padding:0 14px}
  .brand img{height:46px}
  .header-action{font-size:.75rem;padding:8px 10px}
  .hero{display:block;min-height:auto}
  .hero-copy{padding:48px 22px}
  .hero-scene{min-height:390px;overflow:visible}
  .quote{position:relative;left:auto;right:auto;bottom:auto;max-width:none;margin:-40px 16px 0}
  .route-card-grid,.card-grid{grid-template-columns:1fr}
  .step-shell{padding:28px 0 56px}
}
@media(max-width:420px){
  .brand img{height:38px}
  .header-action{font-size:.68rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="site-header"><a class="brand" href="/" aria-label="ReportAnEmptyHome.co.uk home"><img src="assets/raeh-approved-wordmark.png" alt="Report an Empty Home .co.uk" width="380" height="170"></a></header>
<main id="main" class="simple-page"><div class="wrap"><article class="panel">
<h1>Saturday Supplement</h1>
<p class="lead">A weekly property commentary from Property with Hanna.</p>
<form id="subscribe-form" novalidate>
<div class="field"><label for="sub-first">First name <span class="help">(optional)</span></label><input id="sub-first" name="first_name" autocomplete="given-name"></div>
<div class="field"><label class="required" for="sub-email">Email address</label><input id="sub-email" name="email" type="email" autocomplete="email" aria-describedby="sub-email-error" required><p class="field-error" id="sub-email-error"></p></div>
<div class="field"><label class="choice"><input type="checkbox" id="sub-consent" name="marketing_consent" aria-describedby="sub-consent-error" required> Yes, I want to receive the Saturday Supplement by email.</label><p class="field-error" id="sub-consent-error"></p></div>
<div class="honeypot" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
<p class="help">See our <a href="privacy.html">Privacy Notice</a>.</p>
<p id="sub-status" role="status"></p>
<div class="actions"><button class="btn btn-primary" type="submit">SUBSCRIBE</button></div>
</form>
</article></div></main>
<script>(()=>{
const SUBSCRIBE_ENDPOINT="";
const form=document.getElementById("subscribe-form");
const email=document.getElementById("sub-email");
const emailErr=document.getElementById("sub-email-error");
const consent=document.getElementById("sub-consent");
const consentErr=document.getElementById("sub-consent-error");
const status=document.getElementById("sub-status");
form.addEventListener("submit",e=>{
  e.preventDefault();
  if(document.getElementById("website").value)return;
  emailErr.textContent="";email.removeAttribute("aria-invalid");
  consentErr.textContent="";consent.removeAttribute("aria-invalid");
  if(!email.value.trim()||!email.checkValidity()){
    email.setAttribute("aria-invalid","true");
    emailErr.textContent="Enter the email address you would like the Saturday Supplement sent to.";
    email.focus();return;
  }
  if(!consent.checked){
    consent.setAttribute("aria-invalid","true");
    consentErr.textContent="Please confirm you want to receive the Saturday Supplement by email.";
    consent.focus();return;
  }
  status.textContent=SUBSCRIBE_ENDPOINT?"":"Subscription is not yet connected. Nothing has been submitted.";
});
email.addEventListener("input",()=>{if(email.value.trim()){email.removeAttribute("aria-invalid");emailErr.textContent="";}});
consent.addEventListener("change",()=>{if(consent.checked){consent.removeAttribute("aria-invalid");consentErr.textContent="";}});
})();</script>
<footer><div class="wrap"><div class="footer-links"><a href="privacy.html">Privacy</a><a href="reporter-terms.html">Reporter Terms</a><a href="how-it-works.html">How it works</a></div></div></footer>
</body>
</html>
